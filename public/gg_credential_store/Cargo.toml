[package]
name = "gg_credential_store"
version = "0.1.0"
description = "Storage of GitGuardian tokens on a device"
readme = "README.md"
keywords = ["gitguardian", "credentials", "token", "keyring"]
categories = ["authentication"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
in-memory-store = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["now", "serde", "std"] }
gg_fs.workspace = true
gg_url.workspace = true
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
yare = "3.0.0"

[[test]]
name = "credential_store"
required-features = ["in-memory-store"]
