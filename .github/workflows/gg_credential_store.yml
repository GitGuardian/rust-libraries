name: gg_credential_store

on:
  pull_request:
    paths:
      - internal/gg_credential_store/**
      - public/gg_fs/**
      - public/gg_url/**
      - internal/gg_credential_store_test_client/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/gg_credential_store.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Secret Service and machine store (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Install gnome-keyring and Python keyring
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus gnome-keyring python3-keyring python3-secretstorage

      - name: Test against the Secret Service
        run: >-
          dbus-run-session -- bash -c 'printf test | gnome-keyring-daemon --unlock --components=secrets
          && cargo test -p gg_credential_store --all-features --locked -- --ignored'
        env:
          GG_CREDENTIAL_STORE_LIVE: "1"

      - name: Build the test client
        run: cargo build -p gg_credential_store_test_client --locked

      - name: Check that libdbus is not linked
        run: |
          libraries=$(ldd target/debug/gg_credential_store_test_client)
          echo "$libraries"
          if grep libdbus <<<"$libraries"; then exit 1; fi

      - name: Store and read with gnome-keyring and Python keyring
        run: >-
          dbus-run-session --
          internal/gg_credential_store_test_client/ci/secret_service_linux.sh
          target/debug/gg_credential_store_test_client

      - name: Store as root and read as the runner user
        run: >-
          internal/gg_credential_store_test_client/ci/machine_store_linux.sh
          target/debug/gg_credential_store_test_client

  macos:
    name: Keychain and machine store (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Test against the keychains
        run: cargo test -p gg_credential_store --all-features --locked -- --ignored
        env:
          GG_CREDENTIAL_STORE_LIVE: "1"

      - name: Build the test client
        run: cargo build -p gg_credential_store_test_client --locked

      - name: Store and read without the GitGuardian signature
        run: >-
          internal/gg_credential_store_test_client/ci/machine_store_macos.sh
          target/debug/gg_credential_store_test_client

      - name: Install rcodesign
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/rcodesign.tar.gz" \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/apple-codesign-${RCODESIGN_VERSION}-aarch64-apple-darwin.tar.gz"
          echo "${RCODESIGN_SHA256}  $RUNNER_TEMP/rcodesign.tar.gz" | shasum -a 256 --check
          mkdir "$RUNNER_TEMP/rcodesign"
          tar --strip-components=1 -xzf "$RUNNER_TEMP/rcodesign.tar.gz" -C "$RUNNER_TEMP/rcodesign"
          echo "$RUNNER_TEMP/rcodesign" >> "$GITHUB_PATH"
        env:
          RCODESIGN_VERSION: 0.27.0
          RCODESIGN_SHA256: 163520079cd6ad1427791c792735a6ddfcb8eca0187bbcf0cc0bebfa4a62153d

      - name: Run the keychain cases with a self-signed test client
        run: internal/gg_credential_store_test_client/ci/keychain_macos.sh
        timeout-minutes: 10

  windows:
    name: Credential Manager and machine store (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Test against the Credential Manager
        run: cargo test -p gg_credential_store --all-features --locked -- --ignored
        env:
          GG_CREDENTIAL_STORE_LIVE: "1"

      - name: Build the test client
        run: cargo build -p gg_credential_store_test_client --locked

      - name: Install Python keyring
        run: python -m pip install --disable-pip-version-check keyring==25.7.0

      - name: Store and read with Python keyring
        shell: pwsh
        run: >-
          internal/gg_credential_store_test_client/ci/credential_manager_windows.ps1
          target/debug/gg_credential_store_test_client.exe

      - name: Store as an administrator and read as a standard user
        shell: pwsh
        run: >-
          internal/gg_credential_store_test_client/ci/machine_store_windows.ps1
          target/debug/gg_credential_store_test_client.exe
