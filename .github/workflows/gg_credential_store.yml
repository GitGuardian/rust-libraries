name: gg_credential_store

on:
  pull_request:
    paths:
      - public/gg_credential_store/**
      - public/gg_fs/**
      - public/gg_url/**
      - internal/gg_credential_store_test_client/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/gg_credential_store.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  machine-store-linux:
    name: Machine store (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Build the test client
        run: cargo build -p gg_credential_store_test_client --locked

      - name: Store as root and read as the runner user
        run: >-
          internal/gg_credential_store_test_client/ci/machine_store_linux.sh
          target/debug/gg_credential_store_test_client

  macos:
    name: Keychain and machine store (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Test against the keychains
        run: cargo test -p gg_credential_store --all-features --locked -- --ignored
        env:
          GG_CREDENTIAL_STORE_LIVE: "1"

      - name: Build the test client
        run: cargo build -p gg_credential_store_test_client --locked

      - name: Store and read without the GitGuardian signature
        run: >-
          internal/gg_credential_store_test_client/ci/machine_store_macos.sh
          target/debug/gg_credential_store_test_client

  machine-store-windows:
    name: Machine store (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Build the test client
        run: cargo build -p gg_credential_store_test_client --locked

      - name: Store as an administrator and read as a standard user
        shell: pwsh
        run: >-
          internal/gg_credential_store_test_client/ci/machine_store_windows.ps1
          target/debug/gg_credential_store_test_client.exe
