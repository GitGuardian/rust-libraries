name: Main

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  release-pr:
    name: Find release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      merged: ${{ steps.check.outputs.merged }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.head.ref | startswith("release-plz-"))] | length')
          if [ "$count" -gt 0 ]; then merged=true; else merged=false; fi
          echo "merged=$merged" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: [ci, release-pr]
    if: needs.release-pr.outputs.merged == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: release-plz/action@v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
