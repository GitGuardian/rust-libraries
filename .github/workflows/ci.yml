name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      GITGUARDIAN_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - uses: Swatinem/rust-cache@v2.9.3

      - uses: taiki-e/install-action@v2.90.2
        with:
          tool: cargo-deny

      - uses: j178/prek-action@v3.1.0
        env:
          SKIP: ${{ github.event.pull_request.head.repo.fork && 'ggshield' || '' }}

      - name: Check that public crates can be published
        run: cargo publish --workspace --dry-run --no-verify --locked

      - name: Check advisories, licenses and sources
        run: cargo deny --locked check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Clippy
        if: runner.os != 'Linux'
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked --no-fail-fast

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Check
        run: cargo +1.88 check --workspace --all-features --all-targets --locked

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Doc
        run: cargo doc --workspace --all-features --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings
