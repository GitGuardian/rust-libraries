[package]
name = "gg_credential_store_test_client"
version = "0.1.0"
description = "Command-line test client for testing macOS features of gg_credential_store"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
clap = { version = "4", features = ["derive"] }
gg_credential_store = { path = "../../public/gg_credential_store" }
serde_json = "1"
